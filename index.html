<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎁 A Special Gift</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- خلفية القلوب -->
<div id="hearts"></div>

<!-- شاشة الباسورد -->

<section id="passwordPage">

    <div class="glass">

        <h1>🎁</h1>

        <h2>عندي ليك مفاجأة ❤️</h2>

        <p>اكتب كلمة السر</p>

        <input
            id="password"
            type="password"
            placeholder="••••••">

        <button onclick="checkPassword()">
            فتح الهدية
        </button>

        <span id="error"></span>

    </div>

</section>

<!-- الصفحة الرئيسية -->

<section id="home" class="hidden">

    <div class="gift">

        <img
            src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png"
            id="giftBox">

        <h2>اضغط على الهدية 🎁</h2>

    </div>

</section>

<!-- الرسالة -->

<section id="letter" class="hidden">

    <div class="card">

        <h1>💌</h1>

        <h2>رسالة ليك</h2>

        <p id="typing"></p>

        <button onclick="nextPhotos()">
            التالي ❤️
        </button>

    </div>

</section>

<!-- الصور -->

<section id="gallery" class="hidden">

<h2>📸 ذكرياتنا</h2>

<div class="photos">

<img src="images/1.jpg">

<img src="images/2.jpg">

<img src="images/3.jpg">

<img src="images/4.jpg">

</div>

<button onclick="finishGift()">

التالي 🎂

</button>

</section>

<!-- النهاية -->

<section id="finish" class="hidden">

<div class="finishCard">

<h1>🎂</h1>

<h2>Happy Birthday ❤️</h2>

<p>

كل سنة وانت أغلى شخص عندي 💖

أتمنى تكون السنة دي أحلى سنة في حياتك.

</p>

</div>

</section>

<audio
id="music"
loop>

<source src="music.mp3">

</audio>

<script src="script.js"></script>

</body>

</html>
